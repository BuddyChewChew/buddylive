name: DLHD DamiTV Playlist

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate playlist
        run: python3 live/generate.py --output live/dlhd_damitv.m3u

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live/dlhd_damitv.m3u live/dlhd_damitv_with_ids.m3u live/dlhd_damitv.m3u.match_log.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update DLHD DamiTV playlist"
            git push
          fi
